# Obsidio: OPTIONAL compose file, needed only for the persistence bonus.
#
# The C++ starter takes the cheap route the bonus rewards: no database. POST
# /price appends one fdatasync'd line to a log on the named volume below and
# replays it at startup. The graded k6 mix contains no POSTs, so persistence
# costs ~zero CPU during the run -- which is why there is no db service here
# and the app keeps the entire 2 CPU / 2 GB budget instead of splitting it.
#
# The named volume (not the container filesystem) is what carries the data
# across the stricter restart case: `docker rm` + fresh `docker run`.

services:
  app:
    build: ../starters/cpp
    ports:
      - "8080:8080"
    volumes:
      - pricedata:/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  pricedata:
